name: Track riftmana.com Total Value

# Not on a schedule: GitHub's hosted runner IPs consistently get a hard
# Cloudflare challenge that headless Playwright can't clear (confirmed - every
# attempt failed across two separate scheduled runs, while the same script
# passes instantly from a home IP). The real hourly job runs locally via
# Windows Task Scheduler (see scripts/run_and_publish.ps1) and pushes here
# directly. This workflow is kept only for manual/debug runs.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tracker
        run: python track_riftmana.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add total_value_history.csv latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Log total value $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No changes to commit."
          fi
